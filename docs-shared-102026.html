<style>
body, html {
  margin: 0;
  font: 400 15px/1.8 "Lato", sans-serif;
  color: #777;
}

.hero {
  background-image: url("DJI_0102-Enhanced-SR.jpg");
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  height: 40vh;
  min-height: 220px;
}

.intro {
  text-align: center;
  color: #111;
  padding: 30px 16px 10px;
  letter-spacing: 2px;
}

.squares {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 24px;
  padding: 20px 16px 50px;
}

.square {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  width: 300px;
  aspect-ratio: 1 / 1;
  padding: 20px;
  box-sizing: border-box;
  color: #fff;
  text-decoration: none;
  border-radius: 8px;
  transition: transform 0.2s, box-shadow 0.2s;
}

.square:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
}

.square h1 {
  margin: 0 0 10px;
  font-size: 28px;
  line-height: 1.3;
}

.square h3 {
  margin: 0;
  font-weight: 400;
  font-size: 18px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.financials { background-color: #2e6f95; }
.minutes    { background-color: #3f8f5a; }
.governing  { background-color: #8a4f7d; }
</style>
</head>
